<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>有感而发 - 刘汶鑫</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <!-- Quill富文本编辑器 -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1e88e5;
            --text-primary: #2c3e50;
            --text-secondary: #546e7a;
            --border-color: rgba(30, 136, 229, 0.15);
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(to bottom, #f8f9fa 0%, #e8f4f8 100%);
            color: var(--text-primary);
            line-height: 1.8;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* 顶部操作栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .back-link:hover {
            background: white;
            transform: translateX(-5px);
            box-shadow: 0 4px 12px rgba(30, 136, 229, 0.15);
        }

        .admin-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--primary), #42a5f5);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .admin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(30, 136, 229, 0.3);
        }

        /* 页面标题 */
        .page-header {
            text-align: center;
            margin-bottom: 60px;
            padding: 40px 0;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .page-header h1 {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 3.5rem;
            background: linear-gradient(135deg, #1e88e5, #42a5f5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: 3px;
        }

        .page-header p {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 300;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* 文章容器 */
        .posts-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        /* 文章卡片 */
        .post {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.4s ease;
            position: relative;
        }

        .post:hover {
            box-shadow: 0 8px 32px rgba(30, 136, 229, 0.2);
            transform: translateY(-4px);
        }

        .post-header {
            position: relative;
            overflow: hidden;
        }

        .post-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
        }

        .post-meta-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
            padding: 30px;
            color: white;
        }

        .post-date {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 5px;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .post-title-overlay {
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.3;
            color: white;
        }

        .post-content {
            padding: 35px;
        }

        .post-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .post-meta {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            font-family: 'Noto Sans SC', sans-serif;
        }

        .post-text {
            font-size: 1.05rem;
            line-height: 2;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        .post-text img {
            max-width: 100%;
            border-radius: 8px;
            margin: 15px 0;
        }

        .post-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .tag {
            padding: 5px 15px;
            background: linear-gradient(135deg, rgba(30, 136, 229, 0.1), rgba(66, 165, 245, 0.1));
            color: var(--primary);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: 'Noto Sans SC', sans-serif;
            border: 1px solid rgba(30, 136, 229, 0.2);
        }

        /* 删除按钮 */
        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(244, 67, 54, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .delete-btn:hover {
            background: #d32f2f;
            transform: scale(1.1);
        }

        body.admin-mode .delete-btn {
            display: flex;
        }

        /* 管理面板 */
        .admin-panel {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .admin-panel.active {
            display: flex;
        }

        .admin-form {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin: auto;
        }

        .admin-form h2 {
            margin-bottom: 30px;
            color: var(--primary);
            font-family: 'Noto Sans SC', sans-serif;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
            font-family: 'Noto Sans SC', sans-serif;
        }

        .form-group input[type="text"],
        .form-group input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Noto Serif SC', serif;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* 富文本编辑器样式 */
        #editor {
            height: 300px;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 8px;
        }

        .ql-container {
            font-family: 'Noto Serif SC', serif;
            font-size: 1rem;
        }

        /* 图片上传区域 */
        .image-upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            background: rgba(30, 136, 229, 0.02);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .image-upload-area:hover {
            border-color: var(--primary);
            background: rgba(30, 136, 229, 0.05);
        }

        .image-upload-area.has-image {
            padding: 0;
            border: 2px solid var(--border-color);
        }

        .upload-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .upload-text {
            color: var(--text-secondary);
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 0.95rem;
        }

        .preview-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 10px;
            display: none;
        }

        .preview-image.show {
            display: block;
        }

        .remove-image-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(244, 67, 54, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 1.2rem;
            cursor: pointer;
            display: none;
        }

        .remove-image-btn.show {
            display: block;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #42a5f5);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(30, 136, 229, 0.3);
        }

        .btn-cancel {
            background: #e0e0e0;
            color: #666;
        }

        .btn-cancel:hover {
            background: #d0d0d0;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-family: 'Noto Sans SC', sans-serif;
        }

        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 2.5rem;
            }

            .post-image {
                height: 250px;
            }

            .admin-form {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="index.html" class="back-link">
                ← 返回主页
            </a>
            <button class="admin-btn" onclick="toggleAdminMode()">📝 管理文章</button>
        </div>

        <div class="page-header">
            <h1>有感而发</h1>
            <p>生活随笔 · 技术心得 · 偶尔的感悟</p>
        </div>

        <div class="posts-container" id="postsContainer"></div>
    </div>

    <!-- 管理面板 -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-form">
            <h2>✍️ 发布新文章</h2>
            <form id="postForm">
                <div class="form-group">
                    <label>文章标题 *</label>
                    <input type="text" id="postTitle" required placeholder="输入标题...">
                </div>

                <div class="form-group">
                    <label>封面图片（可选）</label>
                    <div class="image-upload-area" id="imageUploadArea" style="position: relative;">
                        <input type="file" id="coverImageInput" accept="image/*" style="display: none;">
                        <div id="uploadPrompt">
                            <div class="upload-icon">📷</div>
                            <div class="upload-text">点击上传封面图片<br><small>支持 JPG、PNG、GIF 格式</small></div>
                        </div>
                        <img id="previewImage" class="preview-image" alt="预览">
                        <button type="button" class="remove-image-btn" id="removeImageBtn">×</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>发布日期 *</label>
                    <input type="date" id="postDate" required>
                </div>

                <div class="form-group">
                    <label>文章内容 * <small style="color: #999;">(可插入图片、设置格式)</small></label>
                    <div id="editor"></div>
                </div>

                <div class="form-group">
                    <label>标签（用逗号分隔）</label>
                    <input type="text" id="postTags" placeholder="例如: 生活感悟, 技术分享, 读书笔记">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeAdminPanel()">取消</button>
                    <button type="submit" class="btn btn-primary">发布文章</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Quill富文本编辑器 -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        // 初始化Quill编辑器
        let quill;
        
        function initEditor() {
            quill = new Quill('#editor', {
                theme: 'snow',
                placeholder: '写下你的感悟...',
                modules: {
                    toolbar: [
                        [{ 'header': [1, 2, 3, false] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        ['blockquote', 'code-block'],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        [{ 'color': [] }, { 'background': [] }],
                        ['link', 'image'],
                        ['clean']
                    ]
                }
            });
        }

        // 初始化示例文章
        const defaultPosts = [
            {
                id: Date.now(),
                title: '关于成长的一些思考',
                content: '<p>人生就像一场漫长的旅行，我们都是匆匆过客。在这个过程中，我们会遇到各种各样的风景，有美好的，也有不那么美好的。但正是这些经历，塑造了我们独特的人生。</p><p><br></p><p>最近在读《活着》，余华先生用最朴实的文字讲述了一个人的一生。生活的苦难并没有击垮福贵，反而让他更加珍惜活着本身。</p>',
                date: '2026-03-10',
                tags: ['人生感悟', '读书笔记', '成长'],
                coverImage: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200'
            }
        ];

        let posts = JSON.parse(localStorage.getItem('blogPosts')) || defaultPosts;

        function savePosts() {
            localStorage.setItem('blogPosts', JSON.stringify(posts));
        }

        if (!localStorage.getItem('blogPosts')) {
            savePosts();
        }

        function renderPosts() {
            const container = document.getElementById('postsContainer');
            
            if (posts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">✍️</div>
                        <p>还没有文章，点击右上角"管理文章"开始创作吧！</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = posts.map(post => {
                const tags = post.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
                
                if (post.coverImage) {
                    return `
                        <article class="post">
                            <button class="delete-btn" onclick="deletePost(${post.id})">×</button>
                            <div class="post-header">
                                <img src="${post.coverImage}" alt="${post.title}" class="post-image">
                                <div class="post-meta-overlay">
                                    <div class="post-date">${formatDate(post.date)}</div>
                                    <h2 class="post-title-overlay">${post.title}</h2>
                                </div>
                            </div>
                            <div class="post-content">
                                <div class="post-text">${post.content}</div>
                                <div class="post-tags">${tags}</div>
                            </div>
                        </article>
                    `;
                } else {
                    return `
                        <article class="post">
                            <button class="delete-btn" onclick="deletePost(${post.id})">×</button>
                            <div class="post-content">
                                <h2 class="post-title">${post.title}</h2>
                                <div class="post-meta">${formatDate(post.date)}</div>
                                <div class="post-text">${post.content}</div>
                                <div class="post-tags">${tags}</div>
                            </div>
                        </article>
                    `;
                }
            }).join('');
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
        }

        function toggleAdminMode() {
            document.body.classList.toggle('admin-mode');
            const isAdmin = document.body.classList.contains('admin-mode');
            document.querySelector('.admin-btn').textContent = isAdmin ? '✓ 管理模式' : '📝 管理文章';
            
            if (isAdmin) {
                document.getElementById('adminPanel').classList.add('active');
                if (!quill) initEditor();
            }
        }

        function closeAdminPanel() {
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('postForm').reset();
            if (quill) quill.setContents([]);
            document.getElementById('previewImage').classList.remove('show');
            document.getElementById('removeImageBtn').classList.remove('show');
            document.getElementById('uploadPrompt').style.display = 'block';
            document.getElementById('imageUploadArea').classList.remove('has-image');
            document.body.classList.remove('admin-mode');
            document.querySelector('.admin-btn').textContent = '📝 管理文章';
            coverImageData = null;
        }

        // 封面图片处理
        let coverImageData = null;
        
        document.getElementById('imageUploadArea').addEventListener('click', function(e) {
            if (e.target.id !== 'removeImageBtn') {
                document.getElementById('coverImageInput').click();
            }
        });

        document.getElementById('coverImageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    coverImageData = e.target.result;
                    document.getElementById('previewImage').src = coverImageData;
                    document.getElementById('previewImage').classList.add('show');
                    document.getElementById('removeImageBtn').classList.add('show');
                    document.getElementById('uploadPrompt').style.display = 'none';
                    document.getElementById('imageUploadArea').classList.add('has-image');
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('removeImageBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            coverImageData = null;
            document.getElementById('coverImageInput').value = '';
            document.getElementById('previewImage').classList.remove('show');
            document.getElementById('removeImageBtn').classList.remove('show');
            document.getElementById('uploadPrompt').style.display = 'block';
            document.getElementById('imageUploadArea').classList.remove('has-image');
        });

        // 提交表单
        document.getElementById('postForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const newPost = {
                id: Date.now(),
                title: document.getElementById('postTitle').value,
                content: quill.root.innerHTML,
                date: document.getElementById('postDate').value,
                tags: document.getElementById('postTags').value.split(',').map(t => t.trim()).filter(t => t),
                coverImage: coverImageData
            };

            posts.unshift(newPost);
            savePosts();
            renderPosts();
            closeAdminPanel();
        });

        function deletePost(id) {
            if (confirm('确定要删除这篇文章吗？')) {
                posts = posts.filter(post => post.id !== id);
                savePosts();
                renderPosts();
            }
        }

        document.getElementById('postDate').valueAsDate = new Date();
        renderPosts();
    </script>
</body>
</html>
