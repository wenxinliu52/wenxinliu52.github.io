<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易工具 - 刘汶鑫</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1e88e5;
            --primary-light: #42a5f5;
            --primary-dark: #1565c0;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-shadow: 0 8px 32px rgba(30, 136, 229, 0.15);
            --card-shadow-hover: 0 16px 48px rgba(30, 136, 229, 0.25);
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 50%, #90caf9 100%);
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 装饰性背景元素 */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            pointer-events: none;
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-20px, 20px) rotate(5deg); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* 页面标题 */
        .page-header {
            text-align: center;
            margin-bottom: 60px;
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-header h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .page-header p {
            font-size: 1.1rem;
            color: #546e7a;
            font-weight: 300;
        }

        /* 返回链接 */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 30px;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateX(-5px);
        }

        /* 工具网格 */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s backwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 工具卡片 */
        .tool-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 35px;
            border: 2px solid rgba(30, 136, 229, 0.2);
            box-shadow: var(--card-shadow);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        /* 卡片装饰光效 */
        .tool-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s;
        }

        .tool-card:hover::before {
            left: 100%;
        }

        .tool-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: var(--card-shadow-hover);
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.95);
        }

        /* 工具图标 */
        .tool-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(30, 136, 229, 0.3);
            transition: all 0.4s ease;
        }

        .tool-card:hover .tool-icon {
            transform: rotate(5deg) scale(1.1);
            box-shadow: 0 12px 28px rgba(30, 136, 229, 0.4);
        }

        /* 工具标题 */
        .tool-card h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a237e;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        /* 工具描述 */
        .tool-description {
            color: #546e7a;
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 25px;
            min-height: 60px;
        }

        /* 工具链接按钮 */
        .tool-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(30, 136, 229, 0.3);
            position: relative;
            overflow: hidden;
        }

        .tool-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .tool-link:hover::before {
            left: 100%;
        }

        .tool-link:hover {
            transform: translateX(5px);
            box-shadow: 0 6px 20px rgba(30, 136, 229, 0.4);
        }

        /* 标签 */
        .tool-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .tag {
            padding: 4px 12px;
            background: rgba(30, 136, 229, 0.1);
            color: var(--primary-dark);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 2rem;
            }

            .tools-grid {
                grid-template-columns: 1fr;
            }

            .tool-card {
                padding: 25px;
            }
        }

        /* 添加工具提示卡片 */
        .add-tool-card {
            background: linear-gradient(135deg, rgba(30, 136, 229, 0.1), rgba(66, 165, 245, 0.1));
            border: 2px dashed var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-tool-card:hover {
            background: linear-gradient(135deg, rgba(30, 136, 229, 0.15), rgba(66, 165, 245, 0.15));
            transform: translateY(-8px);
        }

        .add-tool-card .add-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .add-tool-card p {
            color: var(--primary);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">
            ← 返回主页
        </a>

        <div class="page-header">
            <h1>🛠️ 简易工具</h1>
            <p>提高效率的小插件和自动化脚本</p>
        </div>

        <div class="tools-grid">
            <!-- 工具1: 电子邮件群发器 -->
            <div class="tool-card">
                <div class="tool-icon">📧</div>
                <h2>电子邮件群发器</h2>
                <div class="tool-tags">
                    <span class="tag">邮件</span>
                    <span class="tag">自动化</span>
                    <span class="tag">批处理</span>
                </div>
                <p class="tool-description">
                    高效的批量邮件发送工具，支持自定义模板、附件管理和发送状态跟踪，让邮件群发变得简单高效。
                </p>
                <a href="https://github.com/wenxinliu52/batchmail" class="tool-link" target="_blank">
                    访问项目 →
                </a>
            </div>

            <!-- 添加更多工具的占位卡片 -->
            <div class="tool-card add-tool-card">
                <div class="add-icon">+</div>
                <p>更多工具即将上线</p>
            </div>
        </div>
    </div>

    <script>
        // 添加卡片进入动画的延迟效果
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.tool-card');
            cards.forEach((card, index) => {
                card.style.animationDelay = `${index * 0.1 + 0.2}s`;
            });
        });
    </script>
</body>
</html>
