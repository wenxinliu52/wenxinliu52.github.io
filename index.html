<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刘汶鑫的主页</title>
    <style>
        /* 基础样式 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; 
            color: #333; 
            line-height: 1.6;
            /* 背景图设置 */
            background: url('background.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* 顶部导航栏 */
        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            padding: 0.8rem 5%;
            position: sticky;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            z-index: 100;
        }
        .logo-section { display: flex; align-items: center; gap: 15px; }
        .njust-logo { height: 40px; width: auto; } /* 校徽大小控制 */
        .user-name { 
            font-size: 1.4rem; 
            font-weight: bold; 
            color: #1e88e5; /* 改为优雅的蓝色 */
            text-shadow: 0 1px 3px rgba(30, 136, 229, 0.2);
        }

        .contact-info { font-size: 0.95rem; color: #555; }

        /* 欢迎区域 */
        .hero {
            height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }
        .hero h1 { 
            font-size: 3.5rem; 
            margin-bottom: 0.5rem; 
            text-shadow: 
                0 2px 10px rgba(0,0,0,0.5),
                -1px -1px 0 rgba(255,255,255,0.3),
                1px -1px 0 rgba(255,255,255,0.3),
                -1px 1px 0 rgba(255,255,255,0.3),
                1px 1px 0 rgba(255,255,255,0.3); /* 添加淡白色轮廓 */
        }
        .hero p {
            text-shadow: 
                0 2px 10px rgba(0,0,0,0.5),
                -1px -1px 0 rgba(255,255,255,0.3),
                1px -1px 0 rgba(255,255,255,0.3),
                -1px 1px 0 rgba(255,255,255,0.3),
                1px 1px 0 rgba(255,255,255,0.3); /* 添加淡白色轮廓 */
        }

        /* 项目列表区域 */
        .container { max-width: 1100px; margin: -40px auto 60px; padding: 0 20px; }
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        /* 项目卡片 - 优化配色和边框 */
        .project-card {
            background: rgba(255, 255, 255, 0.5); /* 提高透明度，更好显示背景 */
            border-radius: 20px;
            padding: 30px;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(30, 136, 229, 0.15); /* 蓝色调阴影 */
            border: 2px solid rgba(30, 136, 229, 0.3); /* 蓝色半透明边框 */
            backdrop-filter: blur(10px); /* 背景模糊效果 */
        }
        .project-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 40px rgba(30, 136, 229, 0.3); /* 悬停时蓝色阴影更明显 */
            background: rgba(255, 255, 255, 0.7); /* 悬停时稍微不透明一些 */
            border-color: rgba(30, 136, 229, 0.6); /* 悬停时边框更明显 */
        }
        .card-icon { font-size: 2rem; margin-bottom: 15px; display: block; }
        .project-card h3 { margin-bottom: 12px; font-size: 1.5rem; color: #1d1d1f; }
        .project-card p { font-size: 1rem; color: #666; margin-bottom: 20px; }
        .btn-more { color: #1e88e5; font-weight: bold; } /* 改为蓝色 */

        /* 音乐播放器样式 */
        .music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            padding: 12px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(30, 136, 229, 0.2);
            border: 2px solid rgba(30, 136, 229, 0.3);
            z-index: 1000;
            min-width: 260px;
            backdrop-filter: blur(10px);
            cursor: move;
            user-select: none;
        }
        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            cursor: move;
        }
        .player-title {
            font-size: 13px;
            font-weight: bold;
            color: #1e88e5;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .song-select {
            width: 100%;
            padding: 5px 10px;
            border: 1px solid rgba(30, 136, 229, 0.3);
            border-radius: 8px;
            background: rgba(255,255,255,0.9);
            color: #333;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            outline: none;
            margin-bottom: 8px;
        }
        .song-select:hover {
            border-color: #1e88e5;
            background: white;
        }
        .player-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .control-btn {
            background: rgba(30, 136, 229, 0.1);
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 12px;
        }
        .control-btn:hover {
            background: rgba(30, 136, 229, 0.2);
            transform: scale(1.1);
        }
        .now-playing {
            font-size: 11px;
            color: #666;
            margin-top: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: move;
        }

        footer { text-align: center; padding: 40px; color: white; font-size: 0.9rem; text-shadow: 0 1px 5px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <header>
        <div class="logo-section">
            <img src="njust_logo.png" alt="NJUST Logo" class="njust-logo">
            <span class="user-name">刘汶鑫的主页</span>
        </div>
        <div class="contact-info">
            📧 联系我：<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="3605060004060505010f057647471855595b">3062033793@qq.com</a>
        </div>
    </header>

    <div class="hero">
        <h1>欢迎来到我的数字花园</h1>
        <p>心有所信，方能行远</p>
    </div>

    <div class="container">
        <div class="project-grid">
            
            <a href="https://github.com/你的用户名/tools" class="project-card">
                <span class="card-icon">🛠️</span>
                <h3>简易工具</h3>
                <p>这里存放了一些提高效率的小插件和自动化脚本,旨在简化重复性劳动。</p>
                <span class="btn-more">点击进入 →</span>
            </a>

            <a href="https://github.com/你的用户名/projects" class="project-card">
                <span class="card-icon">📚</span>
                <h3>学习项目</h3>
                <p>记录我的学术成长路径，包含课程设计、研究课题以及技术实践。 </p>
                <span class="btn-more">点击进入 →</span>
            </a>

            <a href="https://github.com/你的用户名/blog" class="project-card">
                <span class="card-icon">✍️</span>
                <h3>有感而发</h3>
                <p>生活随笔、技术心得或是偶尔的感悟。文字是有力量的记录。</p>
                <span class="btn-more">点击进入 →</span>
            </a>

        </div>
    </div>

    <div class="music-player">
        <div class="player-header">
            <span class="player-title">🎵 音乐播放器</span>
        </div>
        <select id="songSelect" class="song-select">
            <option value="">请选择歌曲</option>
        </select>
        <audio id="bgm" loop style="width: 100%; margin-bottom: 5px;"></audio>
        <div class="player-controls">
            <button class="control-btn" id="prevBtn" title="上一曲">⏮️</button>
            <button class="control-btn" id="playPauseBtn" title="播放/暂停">▶️</button>
            <button class="control-btn" id="nextBtn" title="下一曲">⏭️</button>
        </div>
        <div class="now-playing" id="nowPlaying">享受音乐吧~</div>
    </div>

    <footer>
        <p>© 2026 刘汶鑫 | 志之所趋，无远弗届</p>
    </footer>

    <script>
        // ==========================================
        // 在这里添加你的.mp3文件名
        // 只需将文件名添加到下面的数组中即可
        // ==========================================
        const songs = [
            // 示例：取消下面的注释并添加你的歌曲
            // '故风吟游之地.mp3',
            // '贝加尔湖畔.mp3',
            // '你的歌曲名.mp3',
        ];
        // ==========================================

        // 音乐播放器控制
        const audio = document.getElementById('bgm');
        const songSelect = document.getElementById('songSelect');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const nowPlaying = document.getElementById('nowPlaying');

        let isPlaying = false;

        // 初始化歌单
        function initPlaylist() {
            songSelect.innerHTML = '<option value="">请选择歌曲</option>';
            
            if (songs.length === 0) {
                nowPlaying.textContent = '请在代码中添加.mp3文件名';
                return;
            }

            songs.forEach(song => {
                const option = document.createElement('option');
                option.value = song;
                // 显示名称：去掉.mp3后缀
                option.text = song.replace('.mp3', '');
                songSelect.appendChild(option);
            });

            nowPlaying.textContent = '共 ' + songs.length + ' 首歌曲';
        }

        // 加载选中的歌曲
        function loadSong() {
            const selectedSong = songSelect.value;
            if (!selectedSong) return;
            
            audio.src = selectedSong;
            const songName = songSelect.options[songSelect.selectedIndex].text;
            nowPlaying.textContent = '当前播放: ' + songName;
        }

        // 播放/暂停
        function togglePlayPause() {
            if (!songSelect.value) {
                alert('请先选择一首歌曲');
                return;
            }

            if (isPlaying) {
                audio.pause();
                playPauseBtn.textContent = '▶️';
                isPlaying = false;
            } else {
                audio.play();
                playPauseBtn.textContent = '⏸️';
                isPlaying = true;
            }
        }

        // 上一曲
        function playPrevious() {
            if (songSelect.selectedIndex > 1) { // >1 因为第一个是"请选择"
                songSelect.selectedIndex--;
                loadSong();
                if (isPlaying) {
                    audio.play();
                }
            }
        }

        // 下一曲
        function playNext() {
            if (songSelect.selectedIndex < songSelect.options.length - 1) {
                songSelect.selectedIndex++;
            } else {
                songSelect.selectedIndex = 1; // 循环到第一首歌（跳过"请选择"）
            }
            loadSong();
            if (isPlaying) {
                audio.play();
            }
        }

        // 事件监听
        songSelect.addEventListener('change', () => {
            loadSong();
            if (isPlaying) {
                audio.play();
            }
        });

        playPauseBtn.addEventListener('click', togglePlayPause);
        prevBtn.addEventListener('click', playPrevious);
        nextBtn.addEventListener('click', playNext);

        // 歌曲播放结束后自动播放下一曲
        audio.addEventListener('ended', playNext);

        // 页面加载时初始化播放列表
        initPlaylist();

        console.log("音乐播放器已就绪！在代码的 songs 数组中添加你的.mp3文件名");

        // ==========================================
        // 拖动功能
        // ==========================================
        const musicPlayer = document.querySelector('.music-player');
        let isDragging = false;
        let currentX;
        let currentY;
        let initialX;
        let initialY;
        let xOffset = 0;
        let yOffset = 0;

        musicPlayer.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', dragEnd);

        // 触摸设备支持
        musicPlayer.addEventListener('touchstart', dragStart);
        document.addEventListener('touchmove', drag);
        document.addEventListener('touchend', dragEnd);

        function dragStart(e) {
            // 如果点击的是按钮或选择框，不触发拖动
            if (e.target.closest('.control-btn') || e.target.closest('.song-select') || e.target.closest('audio')) {
                return;
            }

            if (e.type === 'touchstart') {
                initialX = e.touches[0].clientX - xOffset;
                initialY = e.touches[0].clientY - yOffset;
            } else {
                initialX = e.clientX - xOffset;
                initialY = e.clientY - yOffset;
            }

            isDragging = true;
        }

        function drag(e) {
            if (isDragging) {
                e.preventDefault();

                if (e.type === 'touchmove') {
                    currentX = e.touches[0].clientX - initialX;
                    currentY = e.touches[0].clientY - initialY;
                } else {
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                }

                xOffset = currentX;
                yOffset = currentY;

                setTranslate(currentX, currentY, musicPlayer);
            }
        }

        function dragEnd(e) {
            initialX = currentX;
            initialY = currentY;
            isDragging = false;
        }

        function setTranslate(xPos, yPos, el) {
            el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`;
        }
    </script>
